[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eudr-geojson-validator"
dynamic = ["version"]
description = "Checks EUDR geolocation files against the European Commission's GeoJSON File Description, with errors and warnings kept apart."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Adewole Olagoke" }]
keywords = ["EUDR", "GeoJSON", "deforestation", "geolocation", "validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
# None at run time, on purpose: the standard library is enough to answer
# whether a file matches a published specification.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
eudr-validate = "eudr_geojson_validator.validate:main"

[project.urls]
Homepage = "https://github.com/aolagoke-dsae/eudr-geojson-validator"
Issues = "https://github.com/aolagoke-dsae/eudr-geojson-validator/issues"

[tool.setuptools]
packages = ["eudr_geojson_validator"]

[tool.setuptools.dynamic]
version = { attr = "eudr_geojson_validator.validate.VALIDATOR_VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
